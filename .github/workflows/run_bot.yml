name: Green Automation Bot

on:
  schedule:
    - cron: '0 */6 * * *'   # runs every 6 hours
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Restore database from previous run
        uses: actions/download-artifact@v4
        with:
          name: registrations-db
        continue-on-error: true   # first run won't have an artifact yet

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py --count 200 --resume

      - name: Save database for next run
        if: always()   # save even if the bot fails mid-run
        uses: actions/upload-artifact@v4
        with:
          name: registrations-db
          path: registrations.db
          retention-days: 90
          overwrite: true
